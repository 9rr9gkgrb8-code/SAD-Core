name: SAD Core CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  SAD_CI_SANDBOX_IMAGE: python@sha256:1042b61448fef4ba92d16a8c7eb4996d027568ce64792a7877fd88511e0af7c6

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
            windows: false
          - os: windows-2025
            python: "3.11"
            windows: true
          - os: windows-2025
            python: "3.12"
            windows: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 reviewed 2026-08-27
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 reviewed 2026-08-27
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Browser syntax
        run: |
          node --check web/app.js
          node --check web/avatar.js
          node --check web/chat.js
          node --check web/developer_workspace.js
          node --check web/memory_tools.js
          node --check web/mobile.js
          node --check web/owner_dashboard.js
          node --check web/platform.js
          node --check web/sw.js
      - name: Full suite
        run: python -m unittest -v
      - name: Protocol Black
        run: python protocol_black.py
      - name: Alpha release gate
        run: python release_gate.py
      - name: Alpha Stable completion gate
        run: python alpha_stable.py
      - name: Beta repository gate
        run: python beta_gate.py
      - name: Alpha operator preflight
        run: python alpha_doctor.py
      - name: Windows deployment preflight
        if: matrix.windows
        run: python windows_doctor.py

  docker-proof:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 reviewed 2026-08-27
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 reviewed 2026-08-27
        with:
          python-version: "3.11"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Preload reviewed digest-pinned Python image
        shell: bash
        run: |
          docker pull "$SAD_CI_SANDBOX_IMAGE"
          docker image inspect "$SAD_CI_SANDBOX_IMAGE" >/dev/null
          echo "SAD_SANDBOX_IMAGE=$SAD_CI_SANDBOX_IMAGE" >> "$GITHUB_ENV"
          echo "Pinned sandbox image: $SAD_CI_SANDBOX_IMAGE"
      - name: Alpha preflight with Docker
        run: python alpha_doctor.py
      - name: Docker isolation proof
        run: python docker_proof.py
