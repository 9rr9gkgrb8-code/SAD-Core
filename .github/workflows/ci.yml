name: SAD Core CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q .
      - name: Full suite
        run: python -m unittest -v
      - name: Alpha release gate
        run: python release_gate.py
      - name: Alpha operator preflight
        run: python alpha_doctor.py
